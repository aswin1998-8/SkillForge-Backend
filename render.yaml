# Render Blueprint — Web service for SkillForge API
# Docs: https://render.com/docs/blueprint-spec
#
# Free plan: Pre-Deploy Command is paid-only. Run migrate in startCommand instead.
services:
  - type: web
    name: skillforge-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python manage.py migrate --noinput && gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 120 --keep-alive 5
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: skillforge-backend-d907.onrender.com,localhost,127.0.0.1
      - key: COOKIE_SECURE
        value: "True"
      - key: COOKIE_SAMESITE
        value: None
      - key: DATABASE_URL
        fromDatabase:
          name: skillforge-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: skillforge-redis
          type: keyvalue
          property: connectionString
      # Also set in Render dashboard:
      # SECRET_KEY, CORS_ALLOWED_ORIGINS, CSRF_TRUSTED_ORIGINS, FRONTEND_URL,
      # CORS_ALLOWED_ORIGIN_REGEXES (optional), GOOGLE_CLIENT_ID, etc.
  - type: worker
    name: skillforge-celery
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: celery -A config worker -l info
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings
      - key: DEBUG
        value: "False"
      - key: DATABASE_URL
        fromDatabase:
          name: skillforge-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: skillforge-redis
          type: keyvalue
          property: connectionString

  - type: keyvalue
    name: skillforge-redis
    plan: free
    maxmemoryPolicy: noeviction
    ipAllowList: []

databases:
  - name: skillforge-db
    plan: free
